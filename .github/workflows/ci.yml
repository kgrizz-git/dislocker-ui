name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: lint + test + coverage
    runs-on: ubuntu-latest
    steps:
      # Pin full commit SHAs (Semgrep: mutable Action tags).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and dev tools
        run: pip install -e ".[dev]"

      - name: Byte-compile package
        run: python3 -m compileall -q -f src

      - name: Ruff lint
        run: ruff check src tests hooks

      - name: Ruff format check
        run: ruff format --check src tests hooks

      - name: Absolute home-path check
        run: python3 hooks/check_absolute_paths.py

      - name: File line-count check
        run: python3 hooks/check_file_size.py

      - name: Install Xvfb for headless tkinter tests
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Pytest with coverage
        run: xvfb-run -a pytest --cov --cov-report=term-missing

  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and dev tools
        run: pip install -e ".[dev]"

      - name: Audit installed dependencies
        run: pip-audit --progress-spinner off

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    container:
      # Pin by digest (mutable tags / zizmor unpinned-images).
      image: semgrep/semgrep@sha256:c98f8829eea377274ee4b10656458b078b88232469b2ff913f091c2317347c9d # 1.170.0
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Semgrep OWASP + Python rules
        run: >
          semgrep scan
          --config p/owasp-top-ten
          --config p/python
          --error
          --metrics=off

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for secrets
        run: gitleaks detect --source . --verbose --redact
