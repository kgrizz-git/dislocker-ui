# SonarQube Cloud Automatic Analysis settings (no CI token required).
# Docs: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis/
#
# Do not add sonar-project.properties or a SONAR_TOKEN GitHub Actions scan while
# Automatic Analysis is enabled — CI-based analysis conflicts with it.
#
# Wildcard exclusions are not supported here. Prefer Administration → General
# Settings → Analysis Scope in the SonarCloud UI for tmp/, .context/, venvs, etc.

sonar.sources=src
sonar.tests=tests
sonar.python.version=3.10,3.11,3.12
sonar.sourceEncoding=UTF-8
